; FLUG-OS — Fluid OS {-1, 0, +1}
; PlatformIO Project Configuration
;
; Build:     pio run -e esp8285
; Upload:    pio run -e esp8285 -t upload
; Monitor:   pio device monitor --port /dev/tty.* --baud 115200

[platformio]
description = FLUG-OS {-1,0,+1} — 802.11 Packet-Wave Sampler for Flipper Zero WiFi v1
default_envs = esp8285

[env]
platform = espressif8266
board = esp8285
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dout
board_build.f_cpu = 80000000L

[env:esp8285]
build_flags =
    -Os
    -D PIO_FRAMEWORK_ARDUINO_ESPRESSIF_CPU=80000000L
    -D FLUGOS_COMMIT='"$FLUGOS_COMMIT"'
; ESP8285 = 1M flash, no SPIFFS → full ~999KB app space
board_build.ldscript = eagle.flash.1m.ld

[env:generic]
; For ESP8266 boards other than ESP8285 (NodeMCU, Wemos D1, etc.)
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200

[env:debug]
; Debug build with serial output, no optimizations
; board_build.ldscript inherited from [env:esp8285] via extends
extends = esp8285
build_flags =
    -Og
    -D PIO_FRAMEWORK_ARDUINO_ESPRESSIF_CPU=80000000L
    -D DEBUG

[env:esp32s3_amoled]
; Auto-detecting Waveshare ESP32-S3-Touch-AMOLED-1.8 (368x448, TCA9554, ES8311)
; and ESP32-S3-Touch-AMOLED-2.06 (410x502, AXP2101, QMI8658, FT3168)
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
build_flags =
    -O2
    -D FLUGOS_S3_AMOLED=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D FLUGOS_COMMIT='"kunisada-kuniyoshi-omni-chan"'

[env:esp32s3_amoled_18]
; Explicit target alias for Waveshare ESP32-S3-Touch-AMOLED-1.8 (368x448)
extends = env:esp32s3_amoled


