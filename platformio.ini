; PlatformIO Project Configuration
[platformio]
description = Flipper WiFi Rev — 802.11 Packet Analyzer for Flipper Zero WiFi Module v1
default_envs = esp8285

[env]
platform = espressif8266
board = esp8285
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dout
board_build.f_cpu = 80000000L

[env:esp8285]
build_flags =
    -Os
    -Wl,-T,esp8266.flash.1m0.ld
    -D PIO_FRAMEWORK_ARDUINO_ESPRESSIF_CPU=80000000L
    -D DEBUG_ESP_PORT=Serial
