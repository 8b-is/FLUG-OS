; FLUG-OS — Fluid OS {-1, 0, +1}
; PlatformIO Project Configuration
;
; Build:     pio run -e esp8285
; Upload:    pio run -e esp8285 -t upload
; Monitor:   pio device monitor --port /dev/tty.* --baud 115200

[platformio]
description = FLUG-OS {-1,0,+1} — 802.11 Packet-Wave Sampler for Flipper Zero WiFi v1
default_envs = esp8285

[env]
platform = espressif8266
board = esp8285
framework = arduino
monitor_speed = 115200
board_build.flash_mode = dout
board_build.f_cpu = 80000000L

[env:esp8285]
build_flags =
    -Os
    -Wl,-T,esp8266.flash.1m0.ld
    -D PIO_FRAMEWORK_ARDUINO_ESPRESSIF_CPU=80000000L
    -D FLUGOS_COMMIT='"$FLUGOS_COMMIT"'

[env:generic]
; For ESP8266 boards other than ESP8285 (NodeMCU, Wemos D1, etc.)
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200

[env:debug]
; Debug build with serial output, no optimizations
extends = esp8285
build_flags =
    -Og
    -Wl,-T,esp8266.flash.1m0.ld
    -D PIO_FRAMEWORK_ARDUINO_ESPRESSIF_CPU=80000000L
    -D DEBUG
