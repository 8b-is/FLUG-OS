# FLUG-OS CI — Build + Test + Sign via Blacksmith Apple Silicon runner.
#
# Triggers:
#   - Push to main (build + test)
#   - Tag v* (build + test + sign + release)
#   - Manual workflow_dispatch

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed for release
  id-token: write   # needed for cosign (keyless signing)

env:
  FLUGOS_COMMIT: ${{ github.sha }}

jobs:
  build:
    strategy:
      matrix:
        env: [esp8285]
    runs-on: blacksmith-6vcpu-macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install PlatformIO in venv
        run: |
          python3 -m venv /tmp/pio-venv
          /tmp/pio-venv/bin/python -m pip install platformio 2>&1 | tail -5
          /tmp/pio-venv/bin/pio --version
          echo "PIO=/tmp/pio-venv/bin/pio" >> $GITHUB_ENV

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}

      - name: Build firmware
        run: |
          $PIO run -e ${{ matrix.env }}

      - name: Rename artifact with version
        run: |
          VERSION="v$(grep FLUGOS_VERSION src/version.h | head -1 | cut -d'"' -f2)"
          cp .pio/build/${{ matrix.env }}/firmware.bin flugos-${{ matrix.env }}-$VERSION.bin
          cp .pio/build/${{ matrix.env }}/firmware.elf flugos-${{ matrix.env }}-$VERSION.elf 2>/dev/null || true

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: flugos-${{ matrix.env }}-${{ github.sha }}
          path: |
            flugos-*.bin
            flugos-*.elf

  sign:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: blacksmith-6vcpu-macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built firmware
        uses: actions/download-artifact@v4
        with:
          pattern: flugos-*
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install OQS provider (post-quantum crypto)
        run: |
          brew install liboqs oqsprovider
          echo "OQS_PROVIDER=$(brew --prefix oqsprovider)/lib/oqsprovider.dylib" >> $GITHUB_ENV
          echo "OPENSSL_MODULES=$(brew --prefix oqsprovider)/lib" >> $GITHUB_ENV

      - name: Generate ML-DSA firmware signing key
        run: |
          # ML-DSA-65 = NIST security level 3 (recommended for most uses)
          # ML-DSA-87 = NIST security level 5 (highest)
          openssl genpkey -algorithm ML-DSA-65 \
            -out flugos-signing-mldsa65.key
          openssl pkey -in flugos-signing-mldsa65.key -pubout \
            -out flugos-signing-mldsa65.pub

      - name: Generate SLH-DSA backup signing key
        run: |
          # SLH-DSA-SHAKE-128s = NIST security level 1, small signatures
          openssl genpkey -algorithm SLH-DSA-SHAKE-128s \
            -out flugos-signing-slhdsa.key
          openssl pkey -in flugos-signing-slhdsa.key -pubout \
            -out flugos-signing-slhdsa.pub

      - name: Generate SHA256 manifest
        run: |
          shasum -a 256 flugos-*.bin flugos-*.elf 2>/dev/null | tee flugos-sha256.txt

      - name: Sign firmware with ML-DSA (post-quantum primary)
        run: |
          for f in flugos-*.bin flugos-*.elf; do
            [ -f "$f" ] || continue
            openssl dgst -sign flugos-signing-mldsa65.key \
              -out "${f}.mldsa65.sig" "$f"
            echo "ML-DSA-65 signed: $f"
          done

      - name: Sign firmware with SLH-DSA (post-quantum backup)
        run: |
          for f in flugos-*.bin flugos-*.elf; do
            [ -f "$f" ] || continue
            openssl dgst -sign flugos-signing-slhdsa.key \
              -out "${f}.slhdsa.sig" "$f"
            echo "SLH-DSA signed: $f"
          done

      - name: Sign SHA256 manifest with ML-DSA
        run: |
          openssl dgst -sign flugos-signing-mldsa65.key \
            -out flugos-sha256.txt.mldsa65.sig flugos-sha256.txt

      - name: Verify ML-DSA signatures
        run: |
          for f in flugos-*.bin flugos-*.elf; do
            [ -f "$f" ] || continue
            openssl dgst -verify flugos-signing-mldsa65.pub \
              -signature "${f}.mldsa65.sig" "$f" && echo "ML-DSA verified: $f"
          done

      - name: Verify SLH-DSA signatures
        run: |
          for f in flugos-*.bin flugos-*.elf; do
            [ -f "$f" ] || continue
            openssl dgst -verify flugos-signing-slhdsa.pub \
              -signature "${f}.slhdsa.sig" "$f" && echo "SLH-DSA verified: $f"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            flugos-*.bin
            flugos-*.elf
            flugos-*.sig
            flugos-*.pem
            flugos-*.mldsa65.sig
            flugos-*.slhdsa.sig
            flugos-signing-mldsa65.pub
            flugos-signing-slhdsa.pub
            flugos-sha256.txt
            flugos-sha256.txt.mldsa65.sig
          generate_release_notes: true
